
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفعيل حساب مسارنا</title>
<style>
body{font-family:Arial;background:#edf3f8;text-align:center;padding:30px 15px}
.card{background:white;max-width:400px;margin:60px auto;padding:25px;border-radius:16px}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border-radius:9px}
input{border:1px solid #ccc}
button{background:#176d9d;color:white;border:0}
</style>
</head>
<body>
<div class="card">
<h2>🚌 مسارنا</h2>
<h3>تفعيل الحساب</h3>
<p id="msg">جاري التحقق من الدعوة...</p>
<form id="form" hidden>
<input id="pass" type="password" minlength="12"
placeholder="كلمة مرور جديدة (12 حرفًا على الأقل)" required>
<input id="confirm" type="password" minlength="12"
placeholder="تأكيد كلمة المرور" required>
<button type="submit">تفعيل الحساب</button>
</form>
</div>

<script type="module">
import {createClient} from
"https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://mbaempgaoniutphduvqi.supabase.co";
const SUPABASE_KEY = "sb_publishable_tfb3CMyykyjxc7wKPzFa9Q_gwjJeM4b";

const msg = document.getElementById("msg");
const form = document.getElementById("form");

const sb = createClient(SUPABASE_URL,SUPABASE_KEY);

async function init(){
  const {data,error} = await sb.auth.getUser();
  if(error || !data.user){
    msg.textContent="افتحي رابط دعوة صالحًا من بريدك";
    return;
  }
  msg.textContent="اختاري كلمة مرور لحسابك";
  form.hidden=false;
}

form.onsubmit=async(e)=>{
  e.preventDefault();
  const pass=document.getElementById("pass").value;
  const confirm=document.getElementById("confirm").value;
  if(pass!==confirm){
    msg.textContent="كلمتا المرور غير متطابقتين";
    return;
  }
  const {error}=await sb.auth.updateUser({password:pass});
  if(error){
    msg.textContent=error.message;
  }else{
    form.hidden=true;
    msg.textContent="✅ تم تفعيل كلمة المرور";
    await sb.auth.signOut();
  }
};
init();
</script>
</body>
</html>
