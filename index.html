
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مسارنا</title>
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: Arial; margin: 0; background: #f5f7fb; text-align: center; }
    header { background: #245b83; color: white; padding: 18px; }
    #map { height: 65vh; width: 100%; }
    button { padding: 12px; margin: 10px; border: 0; border-radius: 10px; background: #245b83; color: white; }
    #stations { padding: 12px; }
  </style>
</head>
<body>
  <header>
    <h2>🚌 مسارنا</h2>
    <p>حددي محطة نزولك على الخريطة</p>
  </header>

  <div id="map"></div>
  <div id="stations">المحطات المحددة: 0</div>
  <button onclick="clearStations()">مسح المحطات</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([21.54, 39.17], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let stations = [];
    let markers = [];

    map.on('click', function(e) {
      const marker = L.marker(e.latlng).addTo(map);
      stations.push(e.latlng);
      markers.push(marker);
      document.getElementById('stations').textContent =
        'المحطات المحددة: ' + stations.length;
    });

    function clearStations() {
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];
      stations = [];
      document.getElementById('stations').textContent =
        'المحطات المحددة: 0';
    }
  </script>
</body>
</html>
