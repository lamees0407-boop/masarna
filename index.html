
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسارنا 🚌</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f7fb;color:#19384e}
header{background:#17557d;color:white;text-align:center;padding:18px}
h1{margin:0 0 8px}
main{max-width:850px;margin:auto;padding:12px}
.panel{background:white;border-radius:14px;padding:15px;margin-bottom:12px}
button,select{width:100%;padding:12px;margin:5px 0;border-radius:9px;font-size:15px}
button{background:#176a9e;color:white;border:0;font-weight:bold}
.secondary{background:#e9eff5;color:#18384f}
.danger{background:#aa4351}
select{background:white;border:1px solid #cbd5df}
#map{height:55vh;min-height:360px;border-radius:12px;margin-bottom:12px}
#status,#result{line-height:1.8}
.item{background:#edf5fc;padding:9px;margin:6px 0;border-radius:8px}
small{color:#64748b}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
<h1>🚌 مسارنا</h1>
<p>طريقنا للبيت بتنظيم أفضل</p>
</header>

<main>
<div class="panel" id="adminPanel" hidden>
<h3>⚙️ إدارة المناطق - نسخة تجريبية</h3>
<select id="group">
<option value="0">أفراد - شوارع ٦ إلى ١٠</option>
<option value="1">فلل الضباط</option>
<option value="2">أفراد - شوارع ١ إلى ٥</option>
<option value="3">العماير</option>
</select>
<button onclick="beginDraw()">✏️ رسم حدود المنطقة</button>
<button onclick="saveZone()">✅ حفظ المنطقة</button>
<button class="secondary" onclick="undoPoint()">تراجع عن نقطة حدود</button>
<button class="secondary" onclick="setStart()">🚌 تحديد بداية الباص</button>
<button class="danger" onclick="deleteZone()">حذف المنطقة المختارة</button>
<small>هذه واجهة تجريبية، وليست محمية بتسجيل دخول.</small>
</div>

<div class="panel">
<h3>📍 اختاري محطة النزول</h3>
<select id="selectedGroup" onchange="showGroup()">
<option value="">عرض جميع المناطق</option>
<option value="0">أفراد ٦–١٠</option>
<option value="1">فلل الضباط</option>
<option value="2">أفراد ١–٥</option>
<option value="3">العماير</option>
</select>
<button onclick="stationMode()">📍 إضافة محطة على الخريطة</button>
<p id="status">اختاري محطة، ثم اضغطي داخل منطقة ملونة.</p>
</div>

<div id="map"></div>

<div class="panel">
<h3>🚌 المحطات والمسار</h3>
<div id="stations">لا توجد محطات.</div>
<button onclick="undoStation()" class="secondary">حذف آخر محطة</button>
<button onclick="calculate()" id="calcBtn">🛣️ احسب مسار القيادة</button>
<div id="result"></div>
<small>
استخدمي نقاطًا تجريبية على طرق عامة فقط.
لا تدخلي مواقع بيوت حقيقية في هذه النسخة.
</small>
</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const names=[
"أفراد ٦–١٠",
"فلل الضباط",
"أفراد ١–٥",
"العماير"
];

const colors=[
"#2386c8",
"#945ac1",
"#dc9528",
"#239a79"
];

const admin=
new URLSearchParams(location.search).get("view")==="admin";

if(admin){
document.getElementById("adminPanel").hidden=false;
}

const map=L.map("map").setView([21.54,39.17],12);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"&copy; OpenStreetMap contributors",
maxZoom:19
}).addTo(map);

let zones={};
try{
zones=JSON.parse(localStorage.getItem("masarna-zones")||"{}");
}catch(e){zones={};}

let stops=[];
let start=null;
let draft=[];
let mode="station";
let layers=[];
let routeLine=null;
let savedStart=null;

try{
savedStart=JSON.parse(localStorage.getItem("masarna-start"));
if(savedStart)start=L.latLng(savedStart);
}catch(e){}

const status=document.getElementById("status");
const result=document.getElementById("result");

function persist(){
localStorage.setItem("masarna-zones",JSON.stringify(zones));
}

function clearRoute(){
if(routeLine){
map.removeLayer(routeLine);
routeLine=null;
}
result.textContent="";
}

function redraw(){
layers.forEach(l=>map.removeLayer(l));
layers=[];

Object.keys(zones).forEach(key=>{
const id=Number(key);
const polygon=L.polygon(zones[key],{
color:colors[id],
weight:3,
fillOpacity:.2,
bubblingMouseEvents:false
}).addTo(map);

// الضغط داخل المنطقة يضيف محطة
polygon.on("click",e=>{
handleClick(e.latlng);
});

layers.push(polygon);
});

if(draft.length){
layers.push(L.polyline(draft,{
color:"#333",dashArray:"5,5"
}).addTo(map));

draft.forEach(p=>{
layers.push(L.circleMarker(p,{
radius:5,color:"#333"
}).addTo(map));
});
}

if(start){
layers.push(L.marker(start).addTo(map)
.bindPopup("🚌 بداية الباص"));
}

stops.forEach((s,i)=>{
const marker=L.circleMarker(s.point,{
radius:9,
color:colors[s.group],
fillColor:colors[s.group],
fillOpacity:1
}).addTo(map);

marker.bindPopup("محطة "+(i+1)+" - "+names[s.group]);
layers.push(marker);
});

document.getElementById("stations").innerHTML=
stops.length?
stops.map((s,i)=>
"<div class='item'>"+(i+1)+". "+names[s.group]+"</div>"
).join(""):
"لا توجد محطات.";
}

function beginDraw(){
if(!admin)return;
mode="draw";
draft=[];
status.textContent="اضغطي على أطراف المنطقة نقطة نقطة.";
redraw();
}

function undoPoint(){
if(!admin||mode!=="draw")return;
draft.pop();
redraw();
}

function saveZone(){
if(!admin)return;
if(draft.length<3){
alert("حددي ثلاث نقاط على الأقل.");
return;
}
const id=document.getElementById("group").value;
zones[id]=draft.map(p=>[p.lat,p.lng]);
persist();
draft=[];
mode="station";
status.textContent="تم حفظ منطقة "+names[id];
redraw();
}

function deleteZone(){
if(!admin)return;
const id=document.getElementById("group").value;
if(!confirm("حذف حدود "+names[id]+"؟"))return;
delete zones[id];
persist();
redraw();
status.textContent="تم حذف حدود المنطقة.";
}

function setStart(){
if(!admin)return;
mode="start";
status.textContent="اضغطي على نقطة بداية الباص.";
}

function stationMode(){
mode="station";
draft=[];
status.textContent="اضغطي داخل المنطقة الملونة لإضافة محطة.";
redraw();
}

function showGroup(){
const id=document.getElementById("selectedGroup").value;
if(id!==""&&zones[id]){
map.fitBounds(L.polygon(zones[id]).getBounds(),{
padding:[25,25]
});
}else if(id!==""){
status.textContent="هذه المنطقة لم تُحدد بعد.";
}
}

function inside(p,poly){
let x=p.lng,y=p.lat,hit=false;
for(let i=0,j=poly.length-1;i<poly.length;j=i++){
const xi=poly[i][1],yi=poly[i][0];
const xj=poly[j][1],yj=poly[j][0];
if(((yi>y)!==(yj>y))&&
x<(xj-xi)*(y-yi)/(yj-yi)+xi)hit=!hit;
}
return hit;
}

function findGroup(point){
for(let id=0;id<4;id++){
if(zones[id]&&inside(point,zones[id]))return id;
}
return -1;
}

function handleClick(point){
if(mode==="draw"){
draft.push(point);
status.textContent="نقاط الحدود: "+draft.length;
redraw();
return;
}

if(mode==="start"){
start=point;
localStorage.setItem("masarna-start",
JSON.stringify([point.lat,point.lng]));
mode="station";
status.textContent="تم تحديد بداية الباص.";
clearRoute();
redraw();
return;
}

const group=findGroup(point);
if(group===-1){
status.textContent="الموقع خارج المناطق المحددة.";
return;
}

if(stops.length>=8){
alert("النسخة التجريبية تدعم 8 محطات فقط.");
return;
}

stops.push({point,group});
status.textContent="تمت إضافة محطة في "+names[group];
clearRoute();
redraw();
}

map.on("click",e=>handleClick(e.latlng));

function undoStation(){
stops.pop();
clearRoute();
redraw();
}

function coords(points){
return points.map(p=>p.lng+","+p.lat).join(";");
}

async function getRouteData(url){
const response=await fetch(url);
if(!response.ok)throw Error("خدمة حساب الطرق غير متاحة");
const data=await response.json();
if(data.code!=="Ok")throw Error("لا يوجد طريق قيادة بين بعض النقاط");
return data;
}

// تحسين ترتيب المحطات مع تثبيت ترتيب التجمعات
function bestOrder(matrix,indices,startIndex){
if(indices.length===0)return [];

let best=[];
let bestCost=Infinity;

function search(current,remaining,path,cost){
if(cost>=bestCost)return;
if(remaining.length===0){
bestCost=cost;
best=[...path];
return;
}
for(let i=0;i<remaining.length;i++){
const next=remaining[i];
const d=matrix[current][next];
if(d===null||!Number.isFinite(d))continue;

search(
next,
remaining.filter((_,j)=>j!==i),
[...path,next],
cost+d
);
}
}

search(startIndex,indices,[],0);

if(best.length!==indices.length){
throw Error("بعض المحطات غير متصلة بطرق قيادة.");
}
return best;
}

async function calculate(){
if(!start){
alert("حددي بداية الباص أولًا من واجهة الإدارة.");
return;
}
if(!stops.length){
alert("أضيفي محطة واحدة على الأقل.");
return;
}

const btn=document.getElementById("calcBtn");
btn.disabled=true;
clearRoute();
result.textContent="جاري حساب الطرق...";

try{
const all=[start,...stops.map(s=>s.point)];
const base="https://router.project-osrm.org";

const table=await getRouteData(
base+"/table/v1/driving/"+coords(all)+
"?annotations=distance"
);

const matrix=table.distances;
let orderedIndices=[];
let current=0;

// لا نغير ترتيب التجمعات الأربعة
for(let g=0;g<4;g++){
const indices=stops.map((s,i)=>s.group===g?i+1:null)
.filter(x=>x!==null);

const ordered=bestOrder(matrix,indices,current);
orderedIndices.push(...ordered);

if(ordered.length){
current=ordered[ordered.length-1];
}
}

// رسم المسار على الطرق الموجودة
await new Promise(r=>setTimeout(r,1200));

const orderedPoints=[
start,...orderedIndices.map(i=>stops[i-1].point)
];

const data=await getRouteData(
base+"/route/v1/driving/"+coords(orderedPoints)+
"?overview=full&geometries=geojson"
);

const route=data.routes[0];
if(!route)throw Error("لم يتم العثور على طريق.");

const line=route.geometry.coordinates.map(p=>[p[1],p[0]]);

routeLine=L.polyline(line,{
color:"#1765cb",
weight:6
}).addTo(map);

map.fitBounds(routeLine.getBounds(),{
padding:[30,30]
});

result.innerHTML=
"<h3>🚌 مسار الباص المقترح</h3>"+
orderedIndices.map((index,i)=>
(i+1)+". "+names[stops[index-1].group]
).join("<br>")+
"<p><b>المسافة: "+
(route.distance/1000).toFixed(2)+" كم</b></p>"+
"<p><b>الوقت التقديري: "+
Math.round(route.duration/60)+" دقيقة</b></p>"+
"<small>المسار يعتمد على الطرق المتوفرة لدى خدمة التوجيه ولا يضمن أن كل طريق مسموح للباص.</small>";

}catch(e){
result.textContent="تعذر الحساب: "+e.message;
}finally{
btn.disabled=false;
}
}

redraw();
</script>
</body>
</html>
